      [753.182, 758.97, "Drinks and prepared foods can also live on the middle shelf if you run out of room up top.", "如果你上方的空间已经用完了，那么饮料和食品也可以放在中间的架子上。"],
      [759.965, 768.367, "The back of the bottom shelf is the coldest spot in the fridge, so store perishable dairy products here to keep them edible longer.", "冰箱底部架子的最靠后位置是最冷的地方，因此应该把易变质的食物存放在这里，这样就能让这些食物保持更长时间的新鲜度。"],
      [769.029, 776.68, "Never store foods with high water content here, because the water within them can and will freeze, effectively ruining them.", "切勿将含水量较高的食物存放在这里，因为这些食物中的水分很容易结冰，从而破坏食物的质量。"],
      [778.057, 782.356, "Questions 12 to 15 are based on the passage you have just heard.", "第 12 至 15 题根据你刚才听到的短文出题。"],
      [783.108, 784.056, "Question 12.", "第 12 题。"],

      [885.607, 886.642, "Recording One.", "录音一。"],
      [887.689, 893.676, "My current research is mainly looking at factors like stress and how it affects our immune system.", "我目前的研究主要聚焦于压力因素以及压力对免疫系统的影响。"],
      [894.354, 900.97, "So the current projects that I'm quite excited about are looking at older people and factors that are important to them.", "目前，我非常感兴趣的一些项目，都是针对老年人以及对他们来说重要的因素进行的研究。"],
      [901.77, 910.352, "In one project we are looking at hip fracture in older people, which is a common event and we're trying to understand the impact of depression.", "在一个项目中，我们正在研究老年人的髋部骨折问题，这是一种常见的疾病。我们试图了解抑郁症对该疾病的影响。"],
      [911.102, 920.626, "Often people in hospital with a hip fracture develop depression, and these are the people that then go on to become feeble a lot more quickly than others.", "经常有髋部骨折的病人在住院期间会出现抑郁症状，而这些患者比其他人的恢复速度要慢得多。"],
      [921.33, 922.511, "They get infections.", "他们容易感染疾病。"],
      [923.025, 925.266, "Often these infections lead to death.", "这些感染常常会导致死亡。"],
      [925.878, 929.243, "So we're trying to slow down that progression to feebleness.", "因此，我们正试图减缓这种逐渐衰弱的过程。"],
      [930.157, 936.538, "So if we can better understand how these factors interact, then we can actually start doing something about it.", "因此，如果我们能够更好地理解这些因素之间的相互作用关系，那么我们就可以开始采取措施来应对这个问题了。"],
      [937.703, 952.815, "The impact that my research will have in Birmingham, first of all, is obviously for older people because these are the people that are having hip fractures and developing depression, and we're trying to improve their health and their quality of life.", "我的研究在伯明翰将会产生积极的影响，尤其是对于那些老年人来说。因为这些人常常面临髋部骨折的问题，同时他们还容易患上抑郁症。我们试图通过研究来改善他们的健康状况和生活质量。"],
      [953.74, 957.907, "But this isn't just a problem in Birmingham or even in the UK.", "不过，这并非只有伯明翰或英国才存在的问题。"],
      [958.398, 960.146, "This is a problem globally.", "这是一个全球性的问题。"],
      [960.771, 961.806, "People are aging.", "人口正在老龄化。"],
      [962.076, 970.852, "There's a lot more people in the older generation who are living for longer but not necessarily staying healthy for a large part of their lives.", "在老年人群中，有很多人的寿命确实很长，但他们并不一定能在整个生命过程中都保持健康的状态。"],
      [971.335, 980.958, "So the last part of their life can often be full of ill health, and we're trying to understand factors that can contribute to the quality of life later on.", "因此，人们生命的最后阶段往往伴随着各种健康问题。我们试图了解那些可能影响晚年生活质量的因素。"],
      [982.164, 987.832, "I think the thing that excites me most about my research is that it feels real and relevant.", "我认为，让我最感兴趣的研究点在于，这些研究看起来非常真实且具有现实意义。"],
      [988.421, 995.496, "Lots of academics are probably very excited about their research, but it might not be that relevant to those around them.", "许多学者对他们的研究可能感到非常兴奋，但这些研究与他们周围的人其实并没有太大的关联。"],
      [996.135, 1001.213, "Whereas I feel that the work I do is relevant to everyone because everyone is aging.", "我觉得我所从事的工作对每个人来说都非常重要，因为所有人都在经历衰老的过程。"],
      [1001.931, 1012.853, "Health is an issue for everyone, regardless of their age, and what I'm trying to do is understand the factors that affect health and how we can improve the quality of life in people.", "健康是每个人都应该关心的问题，无论年龄如何。我试图了解影响健康的各种因素，以及如何提升人们的生活质量。"],
      [1013.755, 1017.111, "So that's one of the things that really excites me about it.", "这也是让我非常感兴趣的事情之一。"],
      [1017.974, 1036.725, "One of the other things is, rather than just taking one perspective, so rather than looking at aging and health just from the perspective of the psychologist, we are now bringing together a lot of different techniques and a lot of different viewpoints to actually look at the sort of different factors affecting health.", "另外一点需要注意的是，我们不应只从心理学家的角度来思考衰老和健康的问题。相反，我们现在试图结合多种不同的技术和观点，来全面分析影响健康的各种因素。"],
      [1038.405, 1042.73, "Questions 16 to 18 are based on the recording you have just heard.", "第 16 至 18 题根据你刚才听到的录音出题。"],
      [1043.451, 1044.379, "Question 16.", "第 16 题。"],
      [1045.196, 1048.882, "What does the speaker say is quite common among older people?", "这位演讲者提到，在老年人中，这种情况相当常见。"],
      [1061.955, 1063.005, "Question 17.", "第 17 题。"],
      [1063.788, 1067.265, "What does the speaker think excites her most about her research?", "这位研究者认为，她的研究中最让她感到兴奋的是什么呢？"],
      [1080.554, 1081.372, "Question 18.", "第 18 题。"],

      [1097.89, 1098.81, "Recording Two.", "录音二。"],
      [1100.027, 1103.154, "Americans are obsessed with celebrity chefs.", "美国人非常喜欢那些著名的厨师。"],
      [1103.766, 1106.24, "We talk about them and try to eat like them.", "我们谈论它们，试图以它们的方式来进食。"],
      [1106.846, 1110.926, "But could we learn something more from them than recipes and techniques?", "但是，我们能否从他们那里学到一些除了烹饪方法和技巧之外的东西呢？"],
      [1111.795, 1120.787, "According to market data enterprises, Americans spend nearly 10 billion dollars a year on self-help and personal-organization products.", "根据市场数据，美国人每年在自助和个人管理产品上的支出接近100亿美元。"],
      [1121.206, 1131.797, "The market is huge, partly because most colleges and graduate schools don't teach basic organization, but cooking schools and professional kitchens do.", "这个市场的规模非常庞大，部分原因是大多数大学和研究生院并不教授基本的组织管理知识，而烹饪学校和专业厨房则会进行这方面的教学。"],
      [1132.772, 1139.858, "Perhaps the principles of cooking organization can be extended to help even those of us who aren't top chefs.", "也许，烹饪组织的原则可以应用到那些并非顶级厨师的人身上，帮助他们更好地进行烹饪活动。"],
      [1140.967, 1146.831, "The system that makes kitchens function is called \"mise-en-place\", or literally \"put in place\".", "使厨房设备能够正常运作的系统被称为“mise-en-place”，字面意思是“将其放置到位”。"],
      [1147.188, 1152.805, "It's a French phrase that means to gather and arrange the ingredients and tools needed for cooking.", "这是一句法语短语，意思是收集和整理烹饪所需的各种食材和工具。"],
      [1153.873, 1157.383, "But for many professional cooks, the phrase means something deeper.", "但对于许多专业的厨师来说，这句话其实蕴含着更深层的含义。"],
      [1157.843, 1159.708, "Some cooks call it their religion.", "有些厨师将其视为自己的“宗教”。"],
      [1160.219, 1168.688, "It helps them coordinate vast amounts of labor and material, and transforms the lives of its practitioners through focus and self-discipline.", "这有助于他们协调大量的劳动和材料资源，同时通过专注和自我约束来提升从业者的生活质量。"],
      [1169.786, 1173.693, "Students at the Culinary Institute of America view it as a way of life.", "美国烹饪学院的学员将其视为一种生活方式。"],
      [1174.339, 1183.423, "It's a way of concentrating their mind to only focus on the aspects that they need to be working on at the moment, to kind of rid themselves of distractions.", "这是一种集中注意力的方法，让大脑只专注于当前需要处理的各项事务，从而摆脱各种干扰因素。"],
      [1184.295, 1188.205, "And it's a habit that some students carry with them even when they're not in the kitchen.", "这是一种习惯，有些学生在不在厨房的时候也会保持这种习惯。"],
      [1188.639, 1190.795, "They mise-en-place their life.", "他们井然有序地安排自己的生活。"],
      [1191.448, 1193.041, "They set up their books for class.", "他们已经准备好上课所需的书籍了。"],
      [1193.306, 1194.771, "They set up their chef whites.", "他们准备好白色厨师服。"],
      [1195.01, 1196.134, "They shine their shoes.", "他们正在擦鞋。"],
      [1196.48, 1199.924, "They know everything that they need every step of the day.", "他们了解在每一天中需要知道的所有信息。"],
      [1200.716, 1204.131, "Then how does one attain this level of organization?", "那么，如何才能达到这种组织水平呢？"],
      [1204.837, 1208.402, "The key to high-level organization is the mindset.", "实现高水平组织运作的关键，在于正确的思维方式。"],
      [1208.919, 1213.935, "Cooks can easily do six hours of preparation for a three-hour dinner shift.", "厨师们可以轻松地为三小时的晚餐时间准备六个小时的食物。"],
      [1214.23, 1220.548, "\"Mise-en-place forces cooks to account for every minute of their time and every movement.", "“井然有序的管理方式要求厨师必须精确计算每一分钟的时间消耗以及每一个动作的细节。”"],
      [1221.45, 1233.234, "Every component of one single dish is in one single corner, so their hand literally moves inches,\" explains Dwayne LiPuma, an instructor at the Culinary Institute of America.", "“每道菜的每个组成部分都位于一个特定的角落里，因此他们的手实际上只能移动几英寸而已，”美国烹饪学院的教师德韦恩·利普马解释道。"],
      [1233.941, 1238.424, "\"Once students set up their station, I should be able to cover up their eyes.", "一旦学生们摆好他们的设备，我就可以遮住他们的眼睛了。"],
      [1238.634, 1246.009, "And they should know that their knives are always here, their oil is always right here, their salt and pepper is always right here.\"", "他们应该明白，他们的刀始终就在身边，他们的油也始终就在那里，而盐和胡椒也同样始终就在眼前。"],
      [1246.81, 1259.873, "But practiced at its highest level, mise-en-place says that time is precious, resources are precious, space is precious, your self-respect and the respect of others are precious.", "但是，在最高水平的练习中，保持秩序意味着时间非常宝贵，资源也非常重要，空间同样至关重要。此外，你的自尊以及他人的尊重也同样不可或缺。"],
      [1260.24, 1261.164, "Use them wisely.", "请谨慎使用它们。"],
      [1261.892, 1263.752, "Isn't that a philosophy for our time?", "这难道不是我们这个时代的哲学吗？"],
      [1265.439, 1270.229, "Questions 19 to 21 are based on the recording you have just heard.", "第 19 至 21 题根据你刚才听到的录音出题。"],
      [1270.999, 1272.263, "Question 19.", "第 19 题。"],
      [1272.762, 1277.565, "What does the speaker say about most colleges and graduate schools in America?", "这位演讲者对于美国大多数大学和研究生院的情况有何评价？"],
      [1290.802, 1291.812, "Question 20.", "第 20 题。"],
      [1292.354, 1298.612, "How do students at the Culinary Institute of America view \"mise en place,\" or \"put in place\"?", "美国烹饪学院的学员对“mise en place”或“准备妥当”有什么看法？"],
      [1312.004, 1313.297, "Question 21.", "第 21 题。"],

  {
    "title": "Section C 第三段",
    "lines": [
      [1330.52, 1331.648, "Recording Three.", "录音三。"],
      [1333.042, 1337.624, "Why do we stop making goals for ourselves and stop progressing in life?", "为什么我们不再为自己设定目标了呢？为什么我们在人生的道路上不再取得进步了呢？"],
      [1338.424, 1344.51, "One reason is the belief that we should accept who we are and not constantly strive to improve ourselves.", "其中一个原因是，人们认为我们应该接受自己的现状，而不是不断努力去改善自己。"],
      [1345.435, 1353.28, "The mistake we make with this is that whilst self-acceptance is imperative, it should actually be used as the basis for growth.", "我们在这一点上犯的一个错误是：虽然自我接纳非常重要，但实际上应该将其作为推动个人成长的基础。"],
      [1354.368, 1363.72, "When we're not growing, learning and seeking improvements in our lives, we tend to stagnate, accepting what is, and stop believing we can be better.", "当我们不再努力成长、学习以及寻求改善自己的生活时，我们往往会陷入停滞状态，接受现状，不再相信自己还有提升的可能。"],
      [1365.14, 1370.174, "A key tool for creating goals and progressing, is using our imagination.", "制定目标并持续前进的关键手段，就是运用我们的想象力。"],
      [1371.199, 1381.888, "Yet as is so often the case, by the time we've reached midlife, we've stopped dreaming about what we want to achieve and feel quite negatively about goal setting.", "然而，正如很多时候所发生的那样，当我们进入中年时，我们已经不再梦想着自己想要实现的目标，反而对设定目标产生了负面的看法。"],
      [1382.762, 1390.947, "Instead of feeling confidence, happiness and satisfaction from achieving our goals, we feel we are always falling short.", "我们不再感受到因实现目标而获得的自信、快乐和满足感，反而总是觉得自己的表现远远不够。"],
      [1391.839, 1395.001, "That leads to disappointment, and we stop dreaming.", "这就会导致失望，而我们也就停止了梦想。"],
      [1395.784, 1404.785, "We stop imagining the life we'd like to have or the person we'd like to be, quickly finding ourselves shattered by the pain of our reality.", "我们不再去想象自己想要拥有的生活或想要成为的人，很快，我们就被现实中的痛苦所击垮。"],
      [1406.105, 1413.629, "Up until now, unless we work in the creative industry, we've found the idea of using \"play\" a bit childish.", "到目前为止，除非我们身处创意产业领域，否则使用“游戏”这个概念似乎有些幼稚。"],
      [1414.545, 1418.873, "In the West, we're mostly operating from our heads, the rational mind.", "在西方，我们大多是以理性思维来运作的。"],
      [1419.685, 1427.521, "But it's beginning to be better understood, because using our imagination is actually one of the most powerful things we could ever do.", "不过，现在人们开始更好地理解这一理念了。因为运用我们的想象力，实际上是一种非常强大的能力。"],
      [1428.86, 1438.091, "The problem with finding ourselves irritated for not achieving the goal is because the goal always changes and we're always adapting, whether we realize it or not.", "我们之所以会感到恼怒，是因为目标总是在不断变化，而我们必须不断适应这些变化——无论我们是否意识到这一点。"],
      [1438.979, 1443.782, "What happens, therefore, is that we end up feeling like we're never going to reach our goals.", "因此，我们最终会觉得自己永远无法实现自己的目标。"],
      [1444.491, 1451.751, "And herein lies one of the biggest misconceptions and reasons for failure, dissatisfaction and unhappiness.", "而这里，正是导致误解、失败、不满和不幸现象发生的最大原因之一。"],
      [1452.284, 1455.966, "We measure against the goal, rather than where we've come from.", "我们应以目标为导向来行事，而不是考虑自己的出发点。"],
      [1456.832, 1460.044, "Dan Sullivan calls this \"the gap and the gain\".", "丹·沙利文将这种现象称为“差距与收益”。"],
      [1460.712, 1468.765, "We measure always against the goal, which we never feel we're reaching, rather than the gain, that is where we've come from.", "我们总是以目标作为衡量标准来衡量自己的表现，但实际上我们从未觉得自己真正达到了那个目标。我们所取得的成果，其实都是源于那个目标本身。"],
      [1469.581, 1474.892, "In measuring where we've come from, rather than where we're trying to get to, we see results.", "在衡量我们是从哪里来的时候，而不是我们试图到达的目的地时，我们才能看到真正的成果。"],
      [1475.851, 1478.709, "We see things we've taken for granted, or not noticed.", "我们常常看到那些我们认为理所当然的事情，或者根本没有注意到它们。"],
      [1479.398, 1488.124, "It's a simple, yet profound change in perception, and what I love about it is the power it has to instantly shift us up a gear.", "这是一种简单而深刻的认知转变。我喜欢的是这种转变所具备的力量——它能够立刻让我们进入更高效的状态。"],
      [1488.949, 1494.379, "It's so, so simple, yet has an immediate, positive impact on our thinking.", "这其实非常简单，但却能立刻对我们的思维方式产生积极的影响。"],
      [1495.638, 1500.689, "Questions 22 to 25 are based on the recording you have just heard.", "第 22 至 25 题根据你刚才听到的录音出题。"],
      [1501.353, 1502.504, "Question 22.", "第 22 题。"],
      [1503.355, 1507.119, "What should self-acceptance be used as according to the speaker?", "根据说话者的说法，自我接纳应该被如何使用呢？"],
      [1520.404, 1521.674, "Question 23.", "第 23 题。"],
      [1522.446, 1525.329, "What do people tend to do when they have reached midlife?", "当人们进入中年阶段时，通常会做些什么呢？"],
      [1538.437, 1539.638, "Question 24.", "第 24 题。"],
      [1540.207, 1543.988, "Why do we find ourselves irritated for not achieving the goal?", "为什么我们会因为未能实现目标而感到恼怒呢？"],
      [1557.129, 1558.286, "Question 25.", "第 25 题。"],
      [1559.031, 1563.393, "What does the speaker say has an immediate positive impact on our thinking?", "演讲者所说的那些内容，究竟是如何对我们的思维产生即时积极影响的呢？"]
    ]
