  {
    "title": "Section C 第一段",
    "lines": [
      [859.634, 860.467, "Recording One.", "录音一。"],
      [861.632, 868.409, "Recent studies show that self-control and persistence increase academic outcomes, independent of IQ.", "最近的研究表明，自我控制能力和坚持精神能够提升学业成绩，而这与智商并无关联。"],
      [869.088, 873.151, "Even our personal beliefs about effort can affect academic outcomes.", "甚至我们对自己努力程度的看法也会影响到学业成绩。"],
      [873.862, 880.041, "Children who think effort leads to achievement outperform those who believe ability is a fixed trait.", "认为努力能够带来成就的孩子，其表现优于那些认为能力是固定不变特质的孩子。"],
      [880.962, 888.729, "Given the link between persistence and academic success, decisions about effort are particularly important in childhood.", "鉴于坚持与学业成功之间存在关联，因此在儿童时期做出关于努力程度的决策显得尤为重要。"],
      [889.097, 895.323, "Yet, relatively little research has explored how young children learn what's worth the effort.", "不过，关于年幼的孩子如何学会那些值得努力去追求的事物，相关的研究其实相对较少。"],
      [896.315, 905.165, "We all know that infants are keen observers of the social world, but they're not just idly watching; they are tiny learning machines.", "我们都知道，婴儿是非常善于观察周围社交环境的，但他们并非只是被动地观看而已；他们其实都是非常聪明的学习者呢。"],
      [905.595, 913.151, "They can generalize such abstract concepts as causal relationships and social roles from just a few examples.", "他们能够仅通过少数几个例子来概括那些抽象的概念，比如因果关系和社会角色。"],
      [913.922, 919.361, "Even a 15-month-old infant can outperform a high level computer in such tasks.", "甚至一个15个月大的婴儿在这些任务中也能超越高性能计算机的表现。"],
      [920.432, 926.374, "Could infants also make broad generalizable inferences from a few examples when it comes to effort?", "在涉及努力程度的问题上，婴儿是否能够从少量例子中做出普遍性的推断呢？"],
      [926.604, 931.027, "If so, then maybe persistence isn't simply a character trait.", "如果是这样的话，那么坚持或许并不只是一种性格特征而已。"],
      [932.086, 936.709, "Maybe it's flexible and adaptable based on social context.", "也许它具有一定的灵活性，能够根据社会环境进行适应调整。"],
      [937.654, 951.568, "To explore this question, we showed 15-month-old babies one of two things—an experimenter working hard to achieve two different goals, or an experimenter who effortlessly reached each goal.", "为了探讨这个问题，我们让15个月大的婴儿尝试两种不同的情境：一种是实验者努力试图实现两个不同的目标，另一种则是实验者轻松就能达成这两个目标。"],
      [952.281, 960.386, "Then we introduced the baby to a novel music toy that seemed as if it could be activated by pushing a big button on top.", "然后，我们让婴儿尝试了一种新的音乐玩具，看起来可以通过按下上面的按钮来激活它。"],
      [961.142, 965.526, "The button could be pressed down, but didn't actually activate anything.", "那个按钮可以被按下，但实际上并没有激活任何功能。"],
      [966.508, 973.334, "Out of sight of the babies, we turned on the music toy with a hidden button so that they heard the toy making music.", "当我们远离那些婴儿的时候，我们打开了那个带有隐藏按钮的音乐玩具，这样他们就能听到玩具发出的声音了。"],
      [974.201, 977.41, "We gave the babies the music toy and left the room.", "我们给那些婴儿提供了音乐玩具，然后离开了房间。"],
      [977.866, 989.931, "Then analysts who didn't know which condition each baby was in, watched videotapes of the experiment and counted how many times babies tried to activate the toy by pressing the button.", "那些不清楚每个婴儿处于何种状态的分析师们，通过观看实验的录像，统计了婴儿尝试激活玩具的次数。"],
      [991.339, 1004.391, "Across one study and a pre-registered duplication, babies who had seen an adult persist and succeed pushed the button about twice as many times as those who saw an adult effortlessly succeed.", "在一项研究中发现，那些目睹了成年人努力尝试并成功按下按钮的婴儿，按压按钮的频率是那些看到成年人轻松完成操作婴儿的约两倍。此外，还有一项预注册实验表明，这一结果在不同婴儿群体中也得到了验证。"],
      [1004.937, 1013.764, "In other words, babies learned that effort was valuable after watching just two examples of an adult working hard and succeeding.", "换句话说，婴儿在看到两个成年人在努力工作的例子后，就明白了付出努力是值得的。"],
      [1015.173, 1020.947, "Part of what's exciting about this finding is that the babies didn't just imitate the adult's actions.", "这一发现令人兴奋的地方在于，这些婴儿不仅仅模仿了成人的行为。"],
      [1021.33, 1025.436, "Instead, they generalized the value of effort to a novel task.", "相反，他们把努力的价值泛化到了一项新的任务上。"],
      [1026.115, 1030.804, "The experimenter never demonstrated pushing a button or trying to make music.", "实验者从未实际按下按钮或尝试制作音乐。"],
      [1031.017, 1039.473, "Instead, the babies learned from different examples of effortful actions that the new toy probably also required persistence.", "相反，这些婴儿是从不同的尝试行为示例中学习到：这个新玩具同样需要坚持不懈的努力才能使用。"],
      [1040.571, 1044.992, "Questions 16 to 18 are based on the recording you have just heard.", "第 16 至 18 题根据你刚才听到的录音出题。"],
      [1046.633, 1047.77, "Question 16.", "第 16 题。"],
      [1048.158, 1052.835, "What does the speaker say even our personal beliefs about effort can do?", "那么，关于努力的个人信念又能起到什么作用呢？"],

      [1103.129, 1104.191, "Recording Two.", "录音二。"],
      [1105.848, 1118.874, "If chronic lateness has taken over your life and turned into a defining trait of who you are, it's likely that you're losing out on job offers, recreational opportunities, friendships, and more.", "如果拖延的习惯已经成为了你生活中的一种特征，那么很可能会让你失去一些工作机会、娱乐活动、友谊等等。"],
      [1119.333, 1127.935, "If you are showing up late to your own life, get organized, prioritize punctuality, and address any underlying causes.", "如果你总是迟到自己的生活当中，那么请好好规划一下时间，重视准时的重要性，并解决那些导致你迟到的根本原因。"],
      [1128.612, 1134.214, "When you have to be somewhere, try to arrive 15 to 30 minutes before you need to.", "如果你必须在某个地方出现，尽量在到达那里之前15到30分钟就出发。"],
      [1134.842, 1140.464, "If you always run late, that means you must be failing to account for something you always do.", "如果你总是迟到，那意味着你在某个方面做得不够好。"],
      [1141.231, 1145.023, "Anticipate that by giving yourself extra time to arrive.", "请提前预留一些时间以确保能够准时到达。"],
      [1145.86, 1149.36, "Keep track of whether or not you actually do arrive early.", "请记录下自己是否真的提前到了现场。"],
      [1149.954, 1154.839, "You might find that leaving early gets you to places exactly on time.", "你可能会发现，提前出发能够让你准时到达目的地。"],
      [1155.886, 1157.211, "Set two alarms.", "设置两个闹钟吧。"],
      [1157.82, 1165.256, "Set one alarm that lets you know it's time to drop what you're doing and a second alarm that means you need to walk out the door.", "设置一个闹钟，提醒你何时应该停止手头的工作；再设置一个闹钟，提醒你何时需要走出家门。"],
      [1166.016, 1167.467, "Obey the alarms.", "闹钟一响就照做。"],
      [1167.924, 1171.458, "As soon as the first alarm goes off, stop what you're doing.", "一旦第一个警报响起，就立即停止你正在做的事情。"],
      [1171.918, 1178.346, "If it's something you'll be coming back to, like a project for work, make a note to remind yourself where you left off.", "如果这是你之后还会反复做的事情，比如工作上的某个项目，那么请记得记录下自己之前停留在了哪个阶段。这样就能提醒自己不要忘记之前的工作内容。"],
      [1179.114, 1183.331, "Grab everything you need and make sure you know how to get where you're going.", "带上你需要的一切物品，并确保你清楚如何到达目的地。"],
      [1184.247, 1188.707, "Aim to be out the door and on your way before the second alarm rings.", "目标是在第二声警报响起之前就离开门口，继续前进。"],
      [1189.429, 1196.244, "This will only work if you take the alarms seriously, so make sure you react as soon as you hear them.", "只有当你认真对待这些警报时，这个方法才有效。因此，务必在听到警报声后立即采取行动。"],
      [1197.504, 1198.964, "Prepare for the day ahead.", "提前为接下来的一天做好准备。"],
      [1199.522, 1209.025, "Have all of your notes and materials organized well in advance of each event, so that all you have to do is grab them and go when it's the actual day.", "请提前充分准备好所有的笔记和材料，这样在正式活动当天，你就只需迅速取来这些资料即可。"],
      [1209.665, 1215.627, "If mornings are a struggle for you, do as much as you can to ready yourself the night before.", "如果你觉得早晨的准备工作很困难，那么请尽可能在睡前做好一切准备。"],
      [1216.277, 1220.861, "Before you go to bed, lay out your clothes and pack your bag for the next day.", "在睡觉之前，先整理好你的衣物，并收拾好第二天要穿的衣服。"],
      [1222.07, 1225.381, "Learn to leave time in between tasks and meetings.", "学会在完成任务和会议之间留出适当的时间。"],
      [1225.985, 1232.12, "It soon becomes unbearable to shift between one meeting and another without space in between.", "在连续的会议之间切换时，很快就会变得难以忍受了，因为没有足够的间隔时间来休息或调整状态。"],
      [1233.347, 1237.99, "If you overschedule yourself, however, you'll arrive late as soon as you hit a bump.", "不过，如果你安排的时间太紧，那么一旦遇到麻烦事，你就会迟到。"],
      [1239.016, 1251.405, "As well as giving you space, this time also acts as a buffer between events, which can be borrowed from, should you be held up in a prior meeting, allowing you to still get to the next one on time.", "除了为你提供空间之外，这次安排还起到了缓冲作用，可以在遇到暂时无法参加之前的会议情况时，继续推进后续会议，确保你能够按时完成下一个会议的任务。"],
      [1252.661, 1259.482, "Calculate transit time between activities and then add 10 to 30 minutes for unexpected delays.", "计算各个活动之间的时间间隔，然后加上10到30分钟作为意外延误的预留时间。"],
      [1260.845, 1265.659, "Questions 19 to 21 are based on the recording you have just heard.", "第 19 至 21 题根据你刚才听到的录音出题。"],
      [1266.452, 1267.389, "Question 19.", "第 19 题。"],
      [1268.256, 1271.077, "What is the speaker's purpose of giving this talk?", "这位演讲者发表这次演讲的目的是什么？"],
      [1284.422, 1285.294, "Question 20.", "第 20 题。"],
      [1285.932, 1288.918, "What should you do if mornings are a struggle for you?", "如果你觉得早晨的日子很艰难，那么你应该怎么做呢？"],
      [1302.117, 1303.261, "Question 21.", "第 21 题。"],
      [1303.766, 1308.889, "According to the speaker, what can we do to combat unexpected delays?", "根据演讲者的观点，我们可以采取什么措施来应对意外的延误情况呢？"]

      [1322.244, 1323.247, "Recording Three.", "录音三。"],
      [1324.396, 1327.177, "Do you think Bostonians put out the welcome mat?", "你认为波士顿人真的会主动伸出手来欢迎他人吗？"],
      [1327.709, 1330.545, "Do you find other cities to be more or less polite?", "你觉得其他城市的礼貌程度是更高还是更低呢？"],
      [1331.261, 1334.364, "Different cities have different feels for visitors.", "不同的城市给游客带来的感受也各不相同。"],
      [1334.743, 1339.02, "Some are friendly and open; some are formal and distant.", "有些人是友善且热情的；而有些则表现得很正式、冷淡。"],
      [1339.889, 1343.575, "Boston tends to seem hurried and sometimes a little rude.", "波士顿的人似乎总是显得有些匆忙，有时候甚至有点粗鲁。"],
      [1344.099, 1345.72, "That's what some tourists have said.", "一些游客是这么说的。"],
      [1346.863, 1354.932, "One study found that people here are less willing to volunteer to help strangers than those residents of other U.S. cities.", "一项研究发现，与美国其他城市的居民相比，这里的民众更愿意选择不主动帮助陌生人。"],
      [1355.702, 1379.245, "Take a close look next time you're in Boston, and here are some of the things you'll probably see: people smoking in the subway stations despite the frequent reminders not to do so; pedestrians walking when the crosswalk lights say not to do so, ignoring the cars; car drivers speeding, making a loud noise with the horn and occasionally cursing at each other.", "下次当你在波士顿时，请仔细观察一下周围的情况。你可能会看到这样一些现象：尽管有频繁的提醒，人们仍然在地铁站内吸烟；行人在人行横道信号灯指示禁止通行时仍继续行走，而不考虑来往的车辆；汽车司机则超速行驶，同时发出巨大的喇叭声，偶尔还会互相辱骂对方。"],
      [1380.26, 1387.582, "Drivers who can't be bothered to find a place to park, but instead simply turn on their blinker and stop in the middle of the street.", "那些懒得找停车位，而是直接在马路中间停车的司机们。"],
      [1388.827, 1392.77, "Sometimes Bostonians seem like they're just too busy to be polite.", "有时候，波士顿人似乎总是太忙了，以至于没有时间保持礼貌。"],
      [1393.271, 1394.694, "Why is their city like that?", "为什么他们的城市是这样的呢？"],
      [1395.603, 1405.516, "Former U.S. representative Chester Atkins says it's because the Puritan founding fathers were themselves impatient and bad-tempered, and had little time for courtesy.", "前美国众议员切斯特·阿特金斯指出，之所以会出现这种情况，是因为那些创立清教徒教派的先辈们本身就缺乏耐心，脾气暴躁，几乎没有时间去讲究礼貌。"],
      [1406.397, 1409.418, "That culture has carried down to the present day, he believes.", "他认为，这种文化一直延续到了今天。"],
      [1410.422, 1421.93, "Boston College professor Thomas O'Connor thinks a contributing factor is Boston's history as a city where each new group of immigrants was treated with suspicion and exclusion.", "波士顿学院教授托马斯·奥康纳认为，其中一个促成因素就是波士顿的历史背景，在这个城市里，每一个新的移民群体都受到了怀疑和排斥。"],
      [1422.924, 1427.217, "That's given Boston a sense of clannishness and reserve, he thinks.", "他认为，这种特质让波士顿具有了某种群体意识以及保守的性格特点。"],
      [1427.733, 1433.507, "The idea of a stranger greeting another stranger is simply not part of the local culture, he says.", "他说，让一个陌生人去问候另一个陌生人的想法显然不属于当地的文化传统。"],
      [1434.234, 1438.313, "People will begin a conversation with someone they know, but not with a stranger.", "人们通常会与他们认识的人进行交谈，而不会与陌生人交谈。"],
      [1439.354, 1450.17, "Ralph Whitehead, a professor of journalism at the University of Massachusetts at Amherst, thinks it's because Boston's upper class used manners to make class distinctions.", "马萨诸塞大学阿默斯特分校的新闻学教授拉尔夫·怀特黑德认为，这是因为波士顿的上层阶级通过礼仪来体现社会阶层差异。"],
      [1450.981, 1457.406, "By being snobbish about manners, Proper Bostonians made other people scornful of courtesy, he says.", "他说，那些在礼仪方面表现得傲慢无礼的波士顿人，使得其他人也开始鄙视礼貌行为。"],
      [1458.258, 1462.808, "Some say that's just the way Boston is and that the city will never change.", "有些人认为，波士顿就是这样的城市，它永远不会改变。"],
      [1463.217, 1468.411, "Still, other cities with reputations for worse rudeness are trying hard to change their images.", "不过，那些以行为不端而著称的城市也在努力改善自己的形象。"],
      [1468.411, 1473.045, "Paris is one example where people are trying to be friendly.", "巴黎就是一个例子，人们在这里努力表现得友善。"],
      [1473.464, 1475.199, "New York City is another.", "纽约市是另一个例子。"],
      [1475.681, 1480.362, "There, the city is trying to persuade subway riders to be more considerate.", "在那里，市政府正试图说服地铁乘客更加体贴他人。"],
      [1480.95, 1484.518, "If those cities can make the effort, maybe Boston should as well.", "如果那些城市能够付出努力的话，那么波士顿也或许应该这么做吧。"],
      [1485.816, 1490.528, "Questions 22 to 25 are based on the recording you have just heard.", "第 22 至 25 题根据你刚才听到的录音出题。"],
      [1491.447, 1492.666, "Question 22.", "第 22 题。"],
      [1493.376, 1496.329, "What do visitors find about the cities they've been to?", "游客们对他们所到过的城市有什么样的印象呢？"],
      [1509.613, 1510.889, "Question 23.", "第 23 题。"],
      [1511.434, 1516.997, "What did one study find about Bostonians compared with residents of other U.S. cities?", "有一项研究对波士顿居民与其他美国城市的居民进行了比较，发现了什么结果呢？"],
      [1530.431, 1531.684, "Question 24.", "第 24 题。"],
