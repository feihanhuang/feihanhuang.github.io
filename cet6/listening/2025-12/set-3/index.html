      [648.091, 648.921, "Passage Two.", "短文二。", [0.138, 0.968]],
      [649.988, 659.954, "Nottingham Trent University and the Chinese Academy of Sciences have been trying to find a way to prevent deadly outdoor air pollution from penetrating indoors.", "诺丁汉特伦特大学和中国科学院一直在努力寻找方法，以防止致命的室外空气污染进入室内。", [0.139, 10.105]],
      [661.031, 672.447, "They found that if pollution is frozen to around minus 18 degrees Celsius in a condensing tube, the particles gather together and fall to the bottom, allowing fresh, clean air to pass through.", "研究发现，如果污染物质在冷凝管中被冷却到零下18摄氏度左右，那么这些颗粒物就会聚集在一起，最终沉到底部。这样一来，新鲜、干净的空气就能顺利通过。", [0.142, 11.558]],
      [673.328, 676.552, "Their method was able to remove 99% of pollutants.", "他们的方法能够去除99%的污染物。", [0.151, 3.375]],
      [677.126, 685.783, "It is hoped that the work could pave the way for simple modification of air conditioning units, so that they can also clean polluted indoor air.", "希望这项工作能够为实现空调设备的简单改造铺平道路，从而让这些设备也能净化被污染的室内空气。", [0.157, 8.814]],
      [686.952, 696.669, "Outdoor air pollution in cities is a global problem, whether it be haze plaguing Kolkata or poor air impacting the health of children in London schools.", "城市中的户外空气污染是一个全球性问题，无论是加尔各答的雾霾问题，还是伦敦学校中儿童健康受到的影响，都是典型的空气污染案例。", [0.143, 9.86]],
      [697.836, 706.116, "While there are some existing technologies to purify indoor air, they cạn be inefficient, expensive, or produce harmful byproducts.", "虽然目前有一些可用于净化室内空气的技术，但这些技术往往效率低下、成本较高，而且还会产生有害的副产品。", [0.155, 8.435]],
      [706.963, 717.26, "When outdoor air quality is poor, people tend to spend even more time indoors, but outdoor pollution also leads to indoor pollution, and people still suffer.", "当室外空气质量不佳时，人们往往会更多地待在室内。然而，室外污染也会带来室内污染的问题，人们仍然会因此受到困扰。", [0.138, 10.435]],
      [718.152, 723.201, "It is estimated that pollution is linked to over 40,000 early deaths in Britain each year.", "据估计，英国的污染问题每年导致超过4万人的早死。", [0.143, 5.192]],
      [724.318, 737.552, "Professor Gang Pan of the Chinese Academy of Sciences said, \"We have shown in our experiments that simply by circulating polluted air through a small freezing chamber, we can remove most of the fine particles and gas pollutants.", "中国科学院的潘纲教授说：“在我们的实验中，我们发现仅仅通过一个小冷冻室来循环污染空气，就能去除大部分细颗粒物和气体污染物。”", [0.141, 13.375]],
      [738.433, 747.154, "Our study makes it possible to add an air cleaner option to household appliances in areas which might experience extremely poor air conditions.", "我们的研究使得在空气条件极为恶劣的地区，为家用电器添加空气净化功能成为可能。", [0.144, 8.865]],
      [748.041, 755.232, "By controlling indoor air pollution and improving air quality in this way, this work could be greatly beneficial to public health.\"", "通过控制室内空气污染并改善空气质量，这项工作将对公众健康产生极大的益处。”", [0.152, 7.343]],
      [756.747, 760.904, "Questions 12 to 15 are based on the passage you have just heard.", "第 12 至 15 题根据你刚才听到的短文出题。", [0.146, 4.303]],
      [761.807, 762.758, "Question 12.", "第 12 题。", [0.142, 1.093]],
      [763.701, 769.857, "What does the passage say about Nottingham Trent University and the Chinese Academy of Sciences?", "这段文字关于诺丁汉特伦特大学和中国科学院的描述是什么？", [0.14, 6.296]],
      [783.36, 784.585, "Question 13.", "第 13 题。", [0.143, 1.368]],
      [785.03, 790.4, "What do we learn from the passage about existing technologies to purify indoor air?", "从这段关于现有技术用于净化室内空气的内容中，我们能了解到什么呢？", [0.157, 5.527]],
      [803.85, 805.057, "Question 14.", "第 14 题。", [0.137, 1.344]],
      [805.695, 809.407, "What do people tend to do when outdoor air quality is poor?", "当室外空气质量不佳时，人们通常会怎么做呢？", [0.158, 3.87]],
      [822.907, 824.05, "Question 15.", "第 15 题。", [0.138, 1.281]],
      [824.563, 830.38, "What did Professor Gang Pan of the Chinese Academy of Sciences say about their study?", "中国科学院的潘纲教授对他们这项研究有何评论？", [0.138, 5.955]]
    ]

      [843.838, 844.74, "Section C.", "C 节。", [0.141, 1.043]],
      [845.329, 846.053, "Directions.", "答题说明。", [0.144, 0.868]],
      [846.624, 852.523, "In this section, you will hear three recordings of lectures or talks, followed by three or four questions.", "本节有三段讲座或讲话的录音，每段录音之后有三个或四个问题。", [0.143, 6.042]],
      [853.201, 855.136, "The recordings will be played only once.", "这些录音只会播放一次而已。", [0.144, 2.079]],
      [855.764, 862.055, "After you hear a question, you must choose the best answer from the four choices marked A, B, C and D.", "听完问题后，请从 A、B、C、D 四个选项中选出最佳答案。", [0.139, 6.43]],
      [862.746, 867.695, "Then mark the corresponding letter on Answer Sheet 1 with a single line through the centre.", "然后在答题卡 1 上划一条线，标出相应的字母。", [0.137, 5.086]]

  {
    "title": "Section C 第一段",
    "lines": [
      [868.892, 869.919, "Recording One.", "录音一。", [0.139, 1.166]],
      [870.881, 876.608, "Research recently carried out by my team suggests that fish may be self-aware.", "我的团队最近进行的研究表明，鱼类可能具有自我意识。", [0.136, 5.863]],
      [877.481, 886.36, "A certain species of fish recently passed the well-known mirror test-this is a test that demonstrates self-recognition in the animals.", "最近，有一种鱼类通过了著名的“镜子测试”——这项测试旨在验证动物是否具有自我识别能力。", [0.136, 9.015]],
      [887.683, 904.461, "Only a few animals, such as humans, apes, dolphins and some birds can recognise themselves in a mirror, and only these animals capable of self-recognition will attempt to remove marks placed on their skin after noticing them in their reflection.", "只有少数动物能够识别自己的倒影，比如人类、猿类、海豚以及一些鸟类。只有具备自我识别能力的这些动物才会尝试去除皮肤上的痕迹。", [0.138, 16.916]],
      [905.739, 909.78, "This ability suggests the level of higher intelligence and awareness.", "这种能力表明，拥有者具有更高的智力水平和意识能力。", [0.146, 4.187]],
      [910.539, 913.634, "This is not shown by children until around 18 months.", "这一特征在儿童大约18个月大的时候才会显现出来。", [0.146, 3.241]],
      [915.365, 930.252, "Until now, no fish has demonstrated the ability, but our experiments show the fish in question will scrape up against hard surfaces to remove marks placed on its body by our researchers after viewing itself in a mirror.", "到目前为止，还没有任何鱼类表现出这种能力。不过，我们的实验表明，这些鱼类会试图刮除自己身上因在镜子中观察而产生的痕迹。它们会尝试刮除那些由研究人员留下的痕迹。", [0.148, 15.035]],
      [932.301, 941.006, "The behaviours we observe leave little doubt that this fish behaviourally fulfils all criteria of the mirror test as originally laid out.", "我们观察到的行为表明，这种鱼的举止完全符合最初所制定的“镜子测试”中的所有标准。", [0.14, 8.845]],
      [943.016, 950.554, "The fish in our study never attempted to remove the marks when no mirror was present or when the marks were just placed on the mirror.", "在我们的研究中，那些鱼在没有任何镜子的情况下，或者当这些标记仅仅位于镜子上时，都从未尝试过去除这些标记。", [0.151, 7.689]],
      [951.711, 959.242, "Unmarked fish also did not attempt to remove marks from themselves when interacting with a marked fish on the other side of a window.", "那些没有标记的鱼在与另一边的有标记的鱼互动时，也并没有试图去除自身的标记。", [0.158, 7.689]],
      [960.503, 971.91, "These results show either that fish are self-aware or that the mirror test, which is considered to be the gold standard test used to denote higher intelligence, may be flawed.", "这些结果表明，鱼类具有自我意识，或者所谓的“镜子测试”这一用来衡量智力水平的标准方法可能存在缺陷。", [0.142, 11.549]],
      [973.298, 985.856, "What is less clear is whether these behaviours should be considered as evidence that fish are self-aware, even though in the past, these same behaviours have been interpreted as self-awareness in so many other animals.", "不太清楚的是，这些行为是否真的可以证明鱼类具有自我意识。因为在过去，同样的行为也被认为可能是其他动物所具备的自我意识的表现。", [0.145, 12.703]],
      [986.843, 994.71, "Depending on your position, you might reject the interpretation that these behaviours in a fish satisfy passing the test at all.", "根据您的观点，您可能会拒绝这样一种解释：认为鱼类的这些行为足以满足通过测试的标准。", [0.154, 8.021]],
      [995.459, 1004.05, "But on what objective basis can you do this when the behaviours they show are so functionally similar to those of other species that have passed the test?", "但是，当这些物种的行为与其他物种的行为在功能上如此相似时，我们究竟能否基于什么客观标准来做出这样的判断呢？那些已经通过测试的其他物种的行为，其实与这些物种的行为有着非常相似的特性。", [0.154, 8.745]],
      [1005.012, 1008.7, "Results from our research raise more questions than answers.", "我们的研究结果引发的疑问比答案还要多。", [0.155, 3.843]],
      [1009.37, 1016.224, "What if self-awareness develops like an onion, building layer upon layer rather than appearing all at once?", "如果自我意识像洋葱一样一层层发展出来，而非一下子形成，那又该怎么解释呢？", [0.145, 6.999]],
      [1017.089, 1024.59, "Perhaps, in order to explore self-awareness further, we should stop looking at responses to the mirror as a decisive test.", "或许，为了更深入地探索自我意识的问题，我们应该不再将镜子中的反应视为一个决定性的测试标准。", [0.136, 7.637]],
      [1025.174, 1037.854, "Only with a richer theory of the self and a larger test battery will we be able to determine all of the various levels of self-awareness, including where exactly fish fit in.", "只有建立更完善的自我理论，并采用一套更丰富的测试，我们才能区分自我意识的各个层次，弄清鱼究竟处在什么层次。", [0.157, 12.837]],
      [1039.355, 1043.6, "Questions 16 to 18 are based on the recording you have just heard.", "第 16 至 18 题根据你刚才听到的录音出题。", [0.154, 4.399]],
      [1044.431, 1045.379, "Question 16.", "第 16 题。", [0.142, 1.09]],
      [1046.035, 1048.492, "What do we learn about the well-known mirror test?", "关于那个著名的“镜子测试”，我们了解到了哪些信息呢？", [0.138, 2.595]],
      [1062.11, 1063.186, "Question 17.", "第 17 题。", [0.157, 1.233]],
      [1063.917, 1068.49, "What does the study by the speaker's team show about the fish they experimented with?", "演讲者团队的研究结果表明，他们实验用的鱼的情况如何？", [0.14, 4.713]],
      [1082.069, 1083.096, "Question 18.", "第 18 题。", [0.148, 1.175]],
      [1083.908, 1087.048, "What does the speaker say about the results of their research?", "这位演讲者关于他们研究的结果说了什么？", [0.139, 3.279]]
    ]

  {
    "title": "Section C 第二段",
    "lines": [
      [1100.48, 1101.404, "Recording Two.", "录音二。", [0.151, 1.075]],
      [1102.733, 1109.371, "Reading with a young child is important, but does it matter whether you read from an electronic book or traditional print?", "虽然让年幼的孩子阅读非常重要，但使用电子书还是传统纸质书来阅读，这两者之间真的有区别吗？", [0.148, 6.786]],
      [1109.997, 1123.103, "As any parent knows, small children are generally keen on screens, so the finding from a new study that very young children enjoy electronic books more than printed picture books may not come as a huge surprise.", "正如任何父母所知道的那样，年幼的孩子通常都喜欢使用电子设备。因此，一项新的研究发现表明，年幼的孩子们更喜欢电子书而不是纸质图画书，这一结果并不令人意外。", [0.14, 13.246]],
      [1123.602, 1136.928, "But the following additional findings might: both parents and children behave differently when reading electronic versus printed picture books, and the children who read the electronic books learned more.", "不过，还有以下一些有趣的发现：无论是父母还是孩子，在阅读电子版与纸质版图画书时，他们的行为方式都有所不同。而那些阅读电子书的孩子，他们学到的知识也更多一些。", [0.137, 13.463]],
      [1138.492, 1150.2, "Previous studies of young children have suggested that electronic books, which incorporate extra features such as dictionaries and images that depict story events, may have advantages over print.", "先前对幼儿的研究表明，包含词典、图片等附加功能的电子书籍可能比纸质书籍具有优势。", [0.147, 11.855]],
      [1151.32, 1160.999, "In fact, multiple studies have found that electronic books support story comprehension and vocabulary gains beyond what is provided by printed books.", "事实上，多项研究表明，电子书在帮助理解故事内容以及提升词汇量方面，比纸质书籍有着更好的效果。", [0.135, 9.814]],
      [1161.794, 1172.55, "But there's also work suggesting that children sometimes invest less mental effort in learning from electronic books, and the parents talk less about content when sharing such books.", "不过也有研究指出，孩子读电子书时有时投入的脑力较少，家长陪读时也较少谈论书里的内容。", [0.145, 10.901]],
      [1174.1, 1181.128, "The study we're looking at today aims to give us a better understanding of how good electronic books are for young children.", "今天要看的这项研究，旨在让我们更清楚地了解电子书对幼儿有多大益处。", [0.139, 7.167]],
      [1181.89, 1189.039, "For this study, researchers videoed children aged 17 to 26 months reading with one of their parents.", "在这项研究中，研究人员拍摄了17到26个月大的儿童在与父母中的一方一起阅读时的画面。", [0.153, 7.302]],
      [1189.822, 1198.999, "Each parent and child pair was randomly assigned to read either two educational electronic books or two printed books with the same content.", "每一对父母和孩子的组合都被随机分配，让他们阅读两本内容相同但形式不同的电子教育书籍，或者两本纸质书籍。", [0.141, 9.318]],
      [1200.032, 1207.249, "While the parent read the words in the printed books aloud, the electronic books had audio of voice actors reading the text.", "当家长大声朗读印刷书籍中的文字时，电子书则通过语音合成技术，让演员的声音来朗读文本。", [0.151, 7.368]],
      [1208.395, 1219.32, "The researchers found that parents who read the printed books pointed more frequently to pages than parents who read the electronic books, but the opposite was true for the children.", "研究人员发现，那些阅读纸质书籍的家长，会比阅读电子书籍的家长更频繁地指着书页进行讲解。不过，对于孩子们来说，情况则恰恰相反。", [0.138, 11.063]],
      [1220.074, 1228.89, "Children who read the electronic books also commented more on the content and learned more new words than the children who read printed books.", "阅读电子书籍的孩子们，在内容方面的评论更多，同时也会学到更多的新词汇。相比之下，那些阅读纸质书籍的孩子们则没有这样的优势。", [0.153, 8.969]],
      [1229.691, 1234.442, "This greater learning is ascribed to greater engagement with the electronic books.", "这种更好的学习效果，得益于读者对电子书的积极使用。", [0.146, 4.897]],
      [1235.95, 1239.672, "It's important to note that the electronic books in the study were simple.", "需要指出的是，这项研究中使用的电子书籍其实都很简单。", [0.141, 3.863]],
      [1240.253, 1246.672, "While they included background music, animation and sound effects, there were no other extra features.", "虽然这些作品包含了背景音乐、动画效果以及音效，但并没有其他额外的功能或特色。", [0.148, 6.567]],
      [1247.381, 1254.71, "It's also important to note that there's research on older children finding that electronic books don't always bolster learning.", "同样需要注意的是，有一些研究表明，对于年龄较大的儿童来说，电子书并不总能促进他们的学习效果。", [0.148, 7.477]],
      [1255.853, 1263.484, "Parents and educators need to be aware that extra features in electronic books may increase children's participation with them.", "家长和教育工作者应当意识到，电子书籍中的额外功能可能会促使孩子们更加频繁地使用这些书籍。", [0.148, 7.779]],
      [1264.13, 1271.595, "However, if these features don't draw attention to the educational content, they may not serve as a supportive feature.", "不过，如果这些功能并不能吸引人们对教育内容的关注，那么它们就可能无法发挥应有的作用，无法成为有用的辅助功能。", [0.145, 7.61]],
      [1273.386, 1277.696, "Questions 19 to 21 are based on the recording you have just heard.", "第 19 至 21 题根据你刚才听到的录音出题。", [0.137, 4.447]],
      [1278.652, 1279.821, "Question 19.", "第 19 题。", [0.147, 1.316]],
      [1280.486, 1284.206, "What finding from the new study might come as a huge surprise?", "这项新研究可能揭示出什么令人惊讶的结果呢？", [0.157, 3.877]],
      [1298.034, 1299.068, "Question 20.", "第 20 题。", [0.137, 1.171]],
      [1299.672, 1304.399, "What do we learn about previous studies of young children reading electronic books?", "关于幼儿阅读电子书籍的相关研究，我们了解到了哪些信息呢？", [0.143, 4.87]],
      [1318.135, 1319.304, "Question 21.", "第 21 题。", [0.15, 1.319]],
      [1319.951, 1325.725, "What extra features should be included in electronic books to bolster children's learning?", "在电子书中应该包含哪些额外功能，以更好地促进儿童的学习呢？", [0.142, 5.916]]
    ]
  },
  {
    "title": "Section C 第三段",
    "lines": [
      [1339.159, 1340.203, "Recording Three.", "录音三。", [0.15, 1.194]],
      [1341.833, 1343.253, "Let me be honest with you.", "说实话吧。", [0.136, 1.556]],
      [1343.869, 1347.709, "If you're living your life full of regrets, you're wasting your time.", "如果你的人生充满了后悔，那么你就是在浪费时间。", [0.156, 3.996]],
      [1348.454, 1353.349, "Why would you go through life regretting the very decisions that made you who you are today?", "为什么要在生活中为那些塑造了你现在这个人的决定而懊悔呢？", [0.157, 5.052]],
      [1353.997, 1359.196, "There are plenty of unfavorable decisions we've made, but does that mean we should regret them?", "我们确实做出了许多不利的决定，但这意味着我们应该为此感到后悔吗？", [0.156, 5.355]],
      [1359.58, 1360.083, "No.", "不该。", [0.147, 0.65]],
      [1361.011, 1366.269, "I've had many moments where I sit and think about all the things I wish I could have done differently.", "有很多时候，我会坐下来思考那些我希望能够做出不同选择的事情。", [0.138, 5.396]],
      [1366.856, 1372.32, "However, just because things could be different, it doesn't necessarily mean they would be better.", "不过，即便情况可能会有所不同，也不意味着结果一定会更好。", [0.151, 5.615]],
      [1373.256, 1379.281, "You don't have to continually be thinking of all your past decisions and whether or not you made the right one.", "你不必一直都在思考自己过去的所有决定，以及这些决定是否正确。", [0.143, 6.168]],
      [1379.332, 1381.865, "You can't go back and change anything.", "你已经无法再回到过去去改变任何事情了。", [0.147, 2.68]],
      [1382.226, 1384.201, "So what's the point in worrying about it?", "那么，担心这件事有什么意义呢？", [0.137, 2.112]],
      [1385.191, 1391.321, "Every single decision you've ever made, positive or negative, has made you the person you are today.", "你所做出的每一个决定，无论是积极的还是消极的，都塑造了你现在这个样子的人。", [0.15, 6.28]],
      [1392.086, 1396.78, "We want to go back and change parts of our past, but what would be the benefit of that?", "我们希望能够回到过去，改变那些曾经发生过的事情。但是，这样做究竟有什么好处呢？", [0.157, 4.851]],
      [1397.449, 1401.122, "We would have lost the valuable knowledge from the lessons we learned.", "我们将会失去那些从课程中学到的宝贵知识。", [0.144, 3.817]],
      [1402.288, 1406.982, "There are reasons you make the choices you do, and that tells us about who you are.", "你做出那些选择是有原因的，而这些选择本身就反映了你的性格特点。", [0.135, 4.829]],
      [1407.862, 1416.08, "So when it comes to any decision in life, be unapologetically yourself, because at the end of the day, it was you who made that decision.", "因此，在做出任何决定时，请坚持做真实的自己吧。因为归根结底，这个决定是由你亲自做出的。", [0.141, 8.359]],
      [1417.355, 1423.893, "With less time spent focused on regrets, you will finally have time to focus on the more essential things in life.", "当你不再把时间浪费在后悔上时，你终于有时间去关注生活中更为重要的事情了。", [0.154, 6.692]],
      [1424.975, 1429.942, "In any situation, you grow more as a person with every decision you make.", "在任何情况下，你做出的每一个决定都会让你成为一个更成熟的人。", [0.142, 5.109]],
      [1430.389, 1435.783, "Life is full of lessons to learn, so we can't let regret stop us from moving forward.", "生活中充满了需要学习的经验，因此我们不能让遗憾阻碍我们前进的脚步。", [0.156, 5.55]],
      [1436.804, 1445.024, "We don't know if we've made the right or wrong choice until after it has already been made, so it can be easy to start regretting your decision.", "在做出决定之后，我们才明白自己是否做出了正确的选择。因此，很容易开始后悔自己的决定。", [0.139, 8.359]],
      [1446.135, 1450.762, "But if the decision has already been made, what's the purpose of dwelling on it?", "但是，如果决定已经做出来了，那么继续纠结于这个决定还有什么意义呢？", [0.158, 4.785]],
      [1451.167, 1452.161, "There isn't one.", "没有意义。", [0.15, 1.144]],
      [1452.815, 1454.744, "All you can do is move forward.", "你所能做的只有继续前进。", [0.142, 2.071]],
      [1455.436, 1458.789, "You can't let yourself sit there and worry about every past choice.", "你不能一直坐在那里，为过去的所有选择而烦恼。", [0.147, 3.5]],
      [1459.2, 1460.438, "We aren't all perfect.", "我们并非都是完美的。", [0.143, 1.381]],
      [1462.051, 1468.98, "Whenever you make a decision, there will always be a possibility for regret later, but that's how life is supposed to be.", "无论你做出什么样的决定，之后总会有后悔的情绪存在。但生活本就应该如此吧。", [0.138, 7.067]],
      [1469.568, 1471.414, "You will make poor decisions in life.", "在人生的道路上，你可能会做出一些错误的决定。", [0.143, 1.989]],
      [1471.636, 1472.367, "We all do.", "我们所有人都会这么做。", [0.147, 0.878]],
      [1473.38, 1476.649, "But it's what you do with the lessons learned that matters.", "但真正重要的是，如何利用这些经验教训来采取行动。", [0.139, 3.408]],
      [1477.581, 1479.769, "Think about every decision you've ever made.", "想想你曾经做出的每一个决定吧。", [0.14, 2.328]],
      [1480.138, 1481.562, "Were they always the best?", "它们每次都是最好的选择吗？", [0.153, 1.577]],
      [1481.687, 1482.433, "Of course not.", "当然不是了。", [0.142, 0.888]],
      [1482.931, 1485.591, "But look at how far you've come since then.", "但是，看看自那以后你们已经取得了多大的进步吧。", [0.138, 2.798]],
      [1487.255, 1492.262, "Questions 22 to 25 are based on the recording you have just heard.", "第 22 至 25 题根据你刚才听到的录音出题。", [0.142, 5.149]],
      [1493.17, 1494.242, "Question 22.", "第 22 题。", [0.153, 1.225]],
      [1495.164, 1498.422, "What should we do with the unfavourable decisions we've made?", "对于我们所做出的那些不利的决定，我们该怎么办呢？", [0.155, 3.413]],
      [1512.0, 1513.06, "Question 23.", "第 23 题。", [0.143, 1.203]],
      [1513.758, 1517.723, "What does the speaker say about every single decision we've ever made?", "关于我们所做出的每一个决定，说话者都说了些什么呢？", [0.149, 4.114]],
      [1531.271, 1532.388, "Question 24.", "第 24 题。", [0.142, 1.259]],
      [1533.252, 1535.74, "What is life full of, according to the speaker?", "根据演讲者的说法，生活中充满了什么呢？", [0.155, 2.643]],
      [1549.237, 1550.361, "Question 25.", "第 25 题。", [0.156, 1.28]],
      [1551.143, 1555.388, "What is said to be of real importance when we make poor decisions in life?", "当我们做出错误的决定时，究竟有什么事情被认为是真正重要的呢？", [0.142, 4.387]]
    ]
