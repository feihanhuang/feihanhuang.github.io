      [613.56, 618.191, "For some Americans, going out to dinner is a treat, planned and budgeted for.", "对于一些美国人来说，外出就餐是一种享受，他们需要提前计划并考虑到预算问题。", [0.1527, 4.7837]],
      [618.829, 621.397, "For others, it's just a daily occurrence.", "对其他人来说，这不过是每天都会发生的事情而已。", [0.1449, 2.7129]],
      [621.991, 628.541, "And that second group of people is becoming the majority, as the number of Americans who enjoy cooking is declining.", "而第二组人正在逐渐成为主流群体，因为喜欢烹饪的美国人数量正在减少。", [0.1461, 6.6961]],
      [629.677, 637.209, "In the early 2000s, researcher Eddie Yoon conducted a survey to ascertain Americans' attitudes to cooking.", "在21世纪初，研究人员埃迪·尹进行了一项调查，旨在了解美国人对烹饪的态度。", [0.1521, 7.6841]],
      [637.931, 648.544, "The survey found that 15% of Americans loved to cook, 50% said they hated to cook and 35% reported mixed feelings.", "调查显示，有15%的美国人喜欢烹饪，50%的人则讨厌烹饪，而35%的人表示态度不一。", [0.1514, 10.7644]],
      [649.443, 663.046, "When Yoon conducted the same survey 15 years later, only 10% of respondents reported a love of cooking, 45% said they hated it, and 45% had mixed feelings.", "当尹在15年后再次进行同样的调查时，只有10%的受访者表示喜欢烹饪，45%的人表示讨厌烹饪，而另外45%的受访者则持中立态度。", [0.1434, 13.7464]],
      [663.885, 666.77, "Yoon asserts cooking is akin to sewing.", "尹认为，烹饪其实和缝纫没什么两样。", [0.1397, 3.0247]],
      [667.289, 672.335, "As recently as the early 20th century, many Americans sewed their own clothing.", "在20世纪初的那个时候，许多美国人仍然自己动手制作衣物。", [0.1478, 5.1938]],
      [673.287, 681.51, "Today, the vast majority of Americans buy clothing; only a tiny minority still sew and they do it mainly as a hobby.", "如今，绝大多数美国人都是购买服装的消费者；只有极少数人仍然会自己缝制衣服，而他们这么做大多只是为了爱好而已。", [0.1376, 8.3606]],
      [682.393, 686.755, "Yoon believes the number of home cooks will diminish in a similar fashion.", "尹认为，家庭厨师的数量也会以类似的方式减少。", [0.153, 4.515]],
      [688.157, 694.212, "Currently, the average American household spends over $3,000 per year on dining out.", "目前，平均每个美国家庭每年在外出就餐上的支出超过3000美元。", [0.1439, 6.1989]],
      [694.841, 698.887, "However, what people save in convenience, they lose in cash.", "然而，人们虽然在便利性上获得了好处，但却失去了现金资源。", [0.1406, 4.1866]],
      [699.468, 702.346, "Take buying lunch on work days, for example.", "以在工作日购买午餐为例吧。", [0.1439, 3.0219]],
      [702.96, 706.919, "People spend on average $10 per meal when they buy lunch.", "人们在购买午餐时，平均花费为10美元。", [0.1355, 4.0945]],
      [707.48, 710.239, "Making your own lunch, meanwhile, will cost less.", "自己制作午餐的话，成本会更低一些。", [0.1363, 2.8953]],
      [710.832, 717.532, "One survey found people only spend on average $6.30 when they bring lunch prepared at home.", "一项调查显示，当人们自己准备午餐时，平均花费仅为6.30美元。", [0.1447, 6.8447]],
      [718.5, 725.378, "Americans' growing aversion to spending time in the kitchen signifies a host of challenges for the grocery industry.", "美国人越来越不愿意在厨房里花费时间，这给食品行业带来了诸多挑战。", [0.1588, 7.0368]],
      [725.963, 730.029, "It's likely to detrimentally impact family finances as well.", "这很可能会对家庭财务造成负面影响。", [0.1508, 4.2168]],
      [731.253, 734.989, "Questions 12 to 15 are based on the passage you have just heard.", "第 12 至 15 题根据你刚才听到的短文出题。", [0.1379, 3.8739]],
      [735.598, 736.369, "Question 12.", "第 12 题。", [0.1466, 0.9176]],
      [737.068, 740.745, "What do an increasing number of Americans do according to the passage?", "根据文章所述，越来越多的美国人正在做些什么呢？", [0.1537, 3.8307]],
      [754.101, 754.999, "Question 13.", "第 13 题。", [0.1549, 1.0529]],
      [755.699, 758.307, "What does Eddie Yoon think cooking is akin to?", "埃迪·尹认为烹饪与什么相似？", [0.1594, 2.7674]],
      [771.7, 772.58, "Question 14.", "第 14 题。", [0.1473, 1.0273]],
      [773.131, 776.22, "What will Americans be able to do by making their own lunch?", "通过自己制作午餐的方式，美国人能够做出什么呢？", [0.1416, 3.2306]],
      [789.485, 790.357, "Question 15.", "第 15 题。", [0.143, 1.015]],
      [790.915, 795.898, "What does the passage say signifies a host of challenges for America's grocery industry?", "这段文字表明，美国食品杂货行业面临着一系列严峻的挑战。", [0.1362, 5.1192]]
    ]
  },
  {
    "title": "Section C 答题说明",
    "lines": [
      [809.326, 810.229, "Section C.", "C 节。", [0.157, 1.06]],
      [810.824, 811.544, "Directions.", "答题说明。", [0.1399, 0.8599]],
      [812.105, 818.001, "In this section, you will hear three recordings of lectures or talks, followed by three or four questions.", "本节有三段讲座或讲话的录音，每段录音之后有三个或四个问题。", [0.1409, 6.0369]],
      [818.606, 820.523, "The recordings will be played only once.", "这些录音只会播放一次而已。", [0.1374, 2.0544]],
      [821.139, 827.361, "After you hear a question, you must choose the best answer from the four choices marked A, B, C and D.", "听完问题后，请从 A、B、C、D 四个选项中选出最佳答案。", [0.1366, 6.3586]],
      [828.032, 832.935, "Then mark the corresponding letter on Answer Sheet 1 with a single line through the centre.", "然后在答题卡 1 上划一条线，标出相应的字母。", [0.1593, 5.0623]]
    ]
  },
  {
    "title": "Section C 第一段",
    "lines": [
      [834.053, 834.864, "Recording One.", "录音一。", [0.1461, 0.9571]],
      [836.146, 843.593, "Every year, of the more than 2.5 billion bags checked onto flights worldwide, 26 million go missing.", "每年，在全球范围内飞行的超过25亿个行李中，有2600万个行李未能被找到。", [0.1493, 7.5963]],
      [844.052, 849.26, "And of that 26 million, 1 million never make it back to their original owner.", "在那2600万中，有100万从未回到原来的所有者手中。", [0.1402, 5.3482]],
      [850.051, 858.152, "Bad weather and flight delays, miscoded destination tags, and some people simply forgetting to pick up one of their bags are a few of the reasons.", "天气恶劣、航班延误、目的地信息输入错误，以及一些人忘记取自己的行李，这些都是导致这种情况发生的原因。", [0.1571, 8.2581]],
      [858.692, 866.371, "But the number one reason a bag ends up lost is that it has no ID tag and airlines don't know to whom it belongs.", "不过，行李丢失的主要原因在于，这些行李都没有识别标签，而航空公司也并不知道这些行李属于谁。", [0.1516, 7.8306]],
      [867.208, 873.991, "Transferring baggage from check-in to departure gates to arrival gates to baggage claim is a delicate piece of timing.", "将行李从办理登机手续的地方转移到出发口，再送到领取行李的地点，这个过程需要非常精确的时间控制。", [0.1517, 6.9347]],
      [874.493, 878.951, "If the system moves too slowly, the bags won't make connecting flights.", "如果系统的运行速度太慢，那么这些行李包就无法完成转机流程了。", [0.1485, 4.6065]],
      [879.393, 884.771, "If it's too fast, the bags may make the connection, but the passengers might miss the flight.", "如果速度太快，行李可能会与飞机发生接触，这样一来，乘客就有可能错过航班。", [0.1375, 5.5155]],
      [885.41, 890.6, "Each airport has its own way of allotting how much time a bag needs to move in transit.", "每个机场都有自己规定行李在运输过程中所需停留时间的标准。", [0.1463, 5.3363]],
      [891.444, 905.975, "Some airports have sophisticated automated systems, including scanners that read baggage labels, destination coded vehicles that load and unload the bags without stopping, and sorting machines that route baggage to the appropriate gate.", "一些机场配备了先进的自动化系统，包括能够读取行李标签的扫描仪、可以自动装卸行李而无需停车的专用设备，以及能够将行李分配到相应闸口的分拣机器。", [0.146, 14.677]],
      [906.852, 915.894, "Even so, all that technology may not save your baggage tag from being torn off on the conveyor belt, making you the owner of a bag with no name.", "即便如此，所有这些技术也可能无法防止行李标签在传送带上被撕掉，这样一来，你就可能拥有一个没有名字的行李袋。", [0.1418, 9.1838]],
      [917.38, 923.157, "Once a bag goes missing and the passenger files a claim, the bag is declared mishandled by the carrier.", "一旦行李丢失，且乘客提出索赔要求，那么该行李将被认定为承运人处理不当所致。", [0.1424, 5.9194]],
      [923.861, 929.029, "Mishandled refers to bags that have been delayed, lost, stolen or damaged.", "所谓“被错误处理”的包裹，指的是那些被延误、丢失、被盗或受损的包裹。", [0.1451, 5.3131]],
      [929.911, 935.781, "Most delayed bags are only one flight behind their owners and can be delivered within 24 hours.", "大多数延迟送达的包裹，其运输航班仅比寄件人的航班晚一班，因此可以在24小时内送达。", [0.1608, 6.0308]],
      [936.338, 941.94, "The other bags are examined by airline employees for clues to their ownership and destination.", "其他行李则由航空公司工作人员进行检查，以寻找有关这些行李的归属权和目的地信息。", [0.1356, 5.7376]],
      [942.588, 947.583, "If the mystery is solved, those bags are returned to their owners within four or five days.", "如果谜题被解开了，那些包裹将在四到五天内归还给它们的主人。", [0.1423, 5.1373]],
      [948.933, 959.398, "Bags with no destination code or identification tag are shipped to a central warehouse and undergo a comprehensive baggage tracing process over the next 90 days.", "那些没有目的地代码或识别标签的行李会被送到中央仓库，并在接下来的90天内进行全面的追踪处理。", [0.1395, 10.6045]],
      [960.846, 967.419, "Airlines inventory their mishandled baggage, and many use a database to match the contents with owners' descriptions.", "航空公司会对处理不当的行李进行登记管理，许多航空公司还会使用数据库来将行李内容与其所有者提供的信息进行比对。", [0.1407, 6.7137]],
      [967.977, 972.526, "It takes about three months to go from missing in action to irretrievably lost.", "从“失踪作战”状态转变为彻底失去踪迹，大约需要三个月的时间。", [0.1403, 4.6893]],
      [973.208, 980.933, "Once that happens, the bags are donated to charity, sold at auction, or purchased by a company which sells them to the public.", "一旦这些物品被处理掉，它们就会被捐赠给慈善机构、在拍卖会上出售，或者由一家公司收购后向公众销售。", [0.1468, 7.8718]],
      [981.511, 991.054, "So never pack anything of real value in your checked baggage and make sure your name is on the bag along with your phone number so an agent can contact you.", "因此，请不要将任何具有价值的物品放入托运行李中。同时，请确保行李上注明你的姓名以及电话号码，这样工作人员就可以联系到你了。", [0.1428, 9.6858]],
      [992.211, 996.318, "Questions 16 to 18 are based on the recording you have just heard.", "第 16 至 18 题根据你刚才听到的录音出题。", [0.1588, 4.2658]],
      [996.817, 997.975, "Question 16.", "第 16 题。", [0.1411, 1.2991]],
      [998.379, 1002.663, "What is the number one reason a bag ends up lost according to this talk?", "根据这次讨论的内容，导致物品丢失的首要原因是什么？", [0.1357, 4.4197]],
      [1015.876, 1017.142, "Question 17.", "第 17 题。", [0.1568, 1.4228]],
      [1017.641, 1022.323, "What may happen to your baggage even when there are sophisticated automated systems?", "即使有先进的自动化系统存在，您的行李又可能会遇到什么情况呢？", [0.1455, 4.8275]],
      [1035.637, 1036.672, "Question 18.", "第 18 题。", [0.1431, 1.1781]],
      [1037.114, 1040.329, "What does the speaker advise us to do at the end of the talk?", "在演讲结束时，演讲者建议我们该怎么做呢？", [0.1573, 3.3723]]
    ]
  },
  {
    "title": "Section C 第二段",
    "lines": [
      [1053.642, 1054.662, "Recording Two.", "录音二。", [0.1498, 1.1698]],
      [1056.016, 1064.544, "You've probably been with someone who ignored you while interacting with his or her smartphone, and you've probably engaged in this behavior yourself.", "你可能曾经和某个人在一起时，对方在使用智能手机聊天时完全不理睬你。你自己也可能有过这样的经历。", [0.1466, 8.6746]],
      [1065.243, 1072.812, "In a recent survey, nine out of ten respondents said they'd used their smartphone during their most recent social activity.", "在最近的一项调查中，有九成受访者表示，在他们最近的社交活动中使用了智能手机。", [0.1524, 7.7214]],
      [1073.744, 1076.965, "There's also evidence that this behavior is socially harmful.", "此外，还有证据表明这种行为在社交层面上是有害的。", [0.1375, 3.3585]],
      [1077.566, 1085.551, "It can leave people less satisfied with their face-to-face interactions, and it can generate feelings of resentment and jealousy.", "这可能会让人们觉得与他人的面对面交流不再那么令人满意，同时还会产生怨恨和嫉妒的情绪。", [0.1456, 8.1306]],
      [1086.593, 1093.837, "Now, the Journal of Applied Social Psychology has published a new study exploring the reasons for these effects.", "现在，《应用社会心理学杂志》发表了一项新的研究，旨在探讨这些现象产生的原因。", [0.1603, 7.4043]],
      [1094.993, 1099.642, "The study included 128 mostly female student participants.", "这项研究涉及了128名参与者，其中大多数是女性学生。", [0.1489, 4.7979]],
      [1100.299, 1107.518, "The participants watched a three-minute animation in which two cartoon figures interacted and engaged in a conversation.", "参与者观看了一段三分钟的动画作品，其中有两个卡通角色进行互动并进行了对话。", [0.1521, 7.3711]],
      [1108.278, 1112.682, "The conversation couldn't be heard, but could be detected through mouth movements.", "虽然无法听到他们的谈话内容，但可以通过他们的口型动作来感知他们的意图。", [0.1376, 4.5416]],
      [1113.96, 1123.813, "Participants had to imagine themselves as the closest figure in the video, and then make judgments about the conversations and how they felt about their conversation partners.", "参与者需要想象自己是在视频中关系最为亲密的人，然后对所看到的对话内容以及自己对对话对象的感受进行评价。", [0.151, 10.004]],
      [1125.269, 1133.134, "In one version of the experiment, the phone of the participant's conversation partner remained unused on the table throughout the conversation.", "在实验的一个版本中，参与者的对话伙伴的手机在整个对话过程中都未被使用。", [0.149, 8.014]],
      [1133.917, 1141.984, "In another version, their partner's attention was quickly drawn to something on their phone, and they spent the rest of the time interacting with their phone.", "在另一个版本中，他们的伴侣很快被手机上的某些内容吸引住了，于是他们剩下的时间都用来与手机进行互动。", [0.1505, 8.2175]],
      [1142.893, 1151.737, "A third version involved the participant's partner alternating between periods of interaction with their phone and periods where they ignored their phone.", "第三个实验版本中，参与者的伴侣会轮流进行两种行为：要么与参与者保持互动，要么完全忽略手机的存在。", [0.1403, 8.9843]],
      [1152.761, 1159.263, "If you've experienced a similar situation, you probably won't be surprised by the results of the experiments.", "如果你也经历过类似的情况，那么这些实验的结果或许不会让你感到惊讶。", [0.1602, 6.6622]],
      [1160.026, 1164.475, "The participants had a negative view of phone use during social interactions.", "参与者对在社交互动中使用手机的行为持负面态度。", [0.137, 4.586]],
      [1165.051, 1172.045, "The more it was present, the worse they considered both the quality of the interaction and the quality of the relationship.", "它出现的频率越高，人们对互动质量以及关系质量的评价就越好。", [0.1465, 7.1405]],
      [1173.375, 1182.704, "The researchers believed that focusing on one's phone instead of the person one is with has this effect because it's seen as a form of social exclusion.", "研究人员认为，当人们专注于手机而不是身边的人时，就会产生这种效果。这是因为这种行为被视为一种社交排斥的表现。", [0.1374, 9.4664]],
      [1183.974, 1190.579, "They assert that the behavior is analogous to when people have no choice but to eat alone in the school cafeteria.", "他们认为，这种行为类似于人们在学校食堂里不得不独自进食的情况。", [0.1569, 6.7619]],
      [1191.587, 1197.752, "The twist is that this exclusion occurs while sharing a physical encounter and having a conversation.", "有趣的是，这种排除现象发生在进行面对面的交流并交谈的时候。", [0.1421, 6.3071]],
      [1199.054, 1207.182, "Researchers found that the behavior had adverse effects on participants' sense of belonging. need for meaning and self-esteem.", "研究人员发现，这种行为对参与者的归属感、对意义的追求以及自尊心产生了负面影响。", [0.1381, 8.2661]],
      [1208.019, 1213.51, "These negative effects are similar to those caused by traditional forms of social exclusion.", "这些负面影响与传统形式的社会排斥行为所导致的后果类似。", [0.1431, 5.6341]],
      [1214.329, 1221.639, "The new findings are important because they elaborate our understanding of a subtle but common aspect of our daily experience.", "这些新的发现非常重要，因为它们帮助我们更深入地理解日常生活中一个微妙但常见的现象。", [0.1576, 7.4676]],
      [1222.373, 1228.376, "This common behavior can create vicious cycles of detachment even as we try to connect with others.", "这种常见的行为可能会在我们尝试与他人建立联系时，反而导致一种疏离的恶性循环。", [0.1559, 6.1589]],
      [1230.011, 1234.271, "Questions 19 to 21 are based on the recording you have just heard.", "第 19 至 21 题根据你刚才听到的录音出题。", [0.14, 4.4]],
      [1235.114, 1235.963, "Question 19.", "第 19 题。", [0.1491, 0.9981]],
      [1236.554, 1241.371, "What does the speaker say about using one's smartphone during a face-to-face conversation?", "关于在面对面交谈时使用智能手机的问题，说话者有什么看法呢？", [0.1524, 4.9694]],
      [1254.727, 1255.574, "Question 20.", "第 20 题。", [0.1441, 0.9911]],
      [1256.149, 1261.415, "How did the participants in the new study respond regarding phone use during social interactions?", "参与这项新研究的人员在社交互动过程中使用手机的情况如何呢？他们对这一现象的反应是怎样的？", [0.1555, 5.4215]],
      [1274.959, 1276.007, "Question 21.", "第 21 题。", [0.1574, 1.2054]],
      [1276.83, 1282.822, "What does the speaker say can result from the common behavior of using phones during face-to-face conversations?", "说话者提到，在面对面交谈时使用手机这种行为，可能会带来哪些后果呢？", [0.1476, 6.1396]]
    ]
  },
  {
    "title": "Section C 第三段",
    "lines": [
      [1296.419, 1297.324, "Recording Three.", "录音三。", [0.1447, 1.0497]],
      [1298.263, 1301.343, "More and more people travel for a variety of reasons.", "越来越多的人因为各种原因而选择旅行。", [0.1601, 3.2401]],
      [1301.828, 1306.651, "Many are tourists, but many venture forth on personal or professional business.", "其中许多人是游客，但也有很多人是出于个人或职业目的而前往的。", [0.1464, 4.9694]],
      [1307.287, 1313.498, "Whatever the reason for traveling, a common complaint of travelers is the impersonal accommodations they find.", "无论旅行的原因是什么，大多数旅客都会对酒店缺乏个性化服务感到不满。", [0.1458, 6.3568]],
      [1314.323, 1324.899, "After spending five consecutive nights in five similar hotels, the business traveler may find it difficult to remember what happened from day to day or even what towns were visited.", "在连续五晚入住五家相似的酒店后，这位商务旅客可能会难以回忆起每天发生的事情，甚至难以记住自己曾经到过的城市。", [0.1548, 10.7308]],
      [1325.581, 1334.47, "And the tourists may get the mistaken impression that all cities are pretty much the same, at least as far as decoration, food and service are concerned.", "游客可能会误以为，所有的城市在装饰、食物和服务方面都差不多。", [0.1541, 9.0431]],
      [1336.384, 1344.397, "To combat this sense of impersonal sameness, travelers are taking advantage of in-home hospitality or bed-and-breakfast arrangements.", "为了克服这种缺乏个性、千篇一律的旅行体验，许多旅行者选择入住家庭旅馆或民宿来享受更加个性化的服务。", [0.1424, 8.1554]],
      [1344.968, 1353.483, "B&Bs, I mean, bed-and-breakfast arrangements, are private homes which offer lodging and breakfast in a very personalized friendly setting.", "所谓的B&B服务，其实就是提供住宿和早餐的私人住宅。这些住宅环境温馨舒适，且主人非常友善。", [0.1582, 8.6732]],
      [1354.866, 1359.643, "For decades, B&Bs have been the classic way to visit Europe, especially the British Isles.", "几十年来，住提供早餐的民宿一直是游览欧洲的经典选择，尤其是在不列颠群岛。", [0.1558, 4.9328]],
      [1360.036, 1363.138, "And in fact, they are not really a new idea in America.", "事实上，这一理念在美国并不算什么新鲜事物。", [0.1536, 3.2556]],
      [1363.882, 1373.017, "The tradition dates back to colonial times when inns were few and far between, and the weary traveler had to depend on the kindness of strangers for a meal and a bed.", "这一传统可以追溯到殖民时期，那时旅店非常稀少，疲惫的旅行者们不得不依赖陌生人的善意来获得食物和住宿。", [0.1596, 9.2946]],
      [1373.895, 1378.641, "But the revival of B&Bs as desirable accommodations is a fairly recent phenomenon.", "不过，B&B作为受欢迎的住宿方式的复兴其实是一种相当新的现象。", [0.1415, 4.8875]],
      [1380.078, 1387.167, "If the idea of operating a B&B arouses your interest, there are several factors to consider before plunging into this business.", "如果经营一家民宿旅馆的想法引起了你的兴趣，那么在投入这项业务之前，你有几个因素需要考虑。", [0.1596, 7.2486]],
      [1387.726, 1392.509, "The first consideration is your property, not only the building itself, but the location.", "首先需要考虑的是你的房产，不仅包括建筑物本身，还包括其所在的位置。", [0.1538, 4.9368]],
      [1393.148, 1404.518, "If you live near a famous historical site or in a popular destination such as New York City or Washington D.C., your home can be fairly simple yet still do well as a B&B.", "如果你居住在著名的历史遗迹附近，或者像纽约市或华盛顿特区这样的热门旅游胜地，那么你的民宿虽然看起来可能比较简单，但仍然可以很好地满足宾客的需求。", [0.1423, 11.5123]],
      [1405.441, 1417.449, "On the other hand, if your home is architecturally unique or has facilities for the traveler such as a private entrance, private bath or swimming pool, people may be willing to go some distance to reach you.", "另一方面，如果您的住所具有独特的建筑风格，或者拥有一些适合旅客使用的设施，比如私人入口、私人浴室或游泳池的话，那么人们可能会愿意走很远的距离来拜访您。", [0.1577, 12.1657]],
      [1418.466, 1422.552, "Another important factor is the lifestyle of you and your family.", "另一个重要因素就是您和您的家人的生活方式。", [0.1476, 4.2336]],
      [1423.29, 1437.815, "You must take into account whether all members of the family truly enjoy visitors, want to repeatedly discuss local sites and activities, and have the time and energy to handle the additional cooking, cleaning, laundry and the bookkeeping involved.", "你必须考虑一下，家庭中的所有成员是否真的喜欢接待访客，是否愿意反复讨论当地的风景和活动，以及他们是否有足够的时间和精力来承担额外的烹饪、清洁、洗衣以及财务管理工作。", [0.139, 14.664]],
      [1438.86, 1441.255, "The final consideration is a financial one.", "最后一个需要考虑的因素是财务方面的问题。", [0.14, 2.535]],
      [1441.966, 1446.402, "Potential B&B hosts must be realistic about opportunities for income.", "潜在的民宿主人应该对收入来源有清醒的认识。", [0.1374, 4.5734]],
      [1447.119, 1457.245, "While B&Bs usually have low initial costs, experts estimate it would take at least five rooms rented regularly for the host to earn a living from B&B.", "虽然民宿的初期运营成本通常较低，但专家估计，至少需要定期出租五间房间，民宿的主人才能有足够的收入来维持运营。", [0.1443, 10.2703]],
      [1458.556, 1463.182, "Questions 22 to 25 are based on the recording you have just heard.", "第 22 至 25 题根据你刚才听到的录音出题。", [0.1397, 4.7657]],
      [1464.192, 1465.335, "Question 22.", "第 22 题。", [0.1593, 1.3023]],
      [1465.921, 1469.232, "What does the speaker say travelers commonly complain about?", "这位发言人提到，旅行者们通常会抱怨些什么呢？", [0.1381, 3.4491]],
      [1482.571, 1483.809, "Question 23.", "第 23 题。", [0.1481, 1.3861]],
      [1484.316, 1486.943, "What is said about bed and breakfast arrangements?", "关于住宿安排方面有什么规定吗？", [0.1429, 2.7699]],
      [1500.281, 1501.524, "Question 24.", "第 24 题。", [0.1471, 1.3901]],
      [1502.478, 1506.779, "What is the first thing you have to consider if you want to start a B&B business?", "如果想要开展一家民宿业务的话，首先需要考虑的因素是什么？", [0.1498, 4.4508]],
      [1520.042, 1521.288, "Question 25.", "第 25 题。", [0.1596, 1.4056]],
      [1521.642, 1526.489, "What does the speaker say potential B&B hosts must be realistic about?", "这位演讲者认为，潜在的民宿主人应该具备哪些现实意识呢？", [0.14, 4.987]]
    ]
